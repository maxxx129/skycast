name: Update El Nino index
on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update-enso.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_oni.py
      - run: |
          git config user.name "skycast-bot"
          git config user.email "skycast-bot@users.noreply.github.com"
          git add oni.json
          git diff --cached --quiet || (git commit -m "Update El Nino index" && git push)
